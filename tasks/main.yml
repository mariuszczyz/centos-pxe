---
# tasks file for centos-pxe

- name: Install PXE server packages
  ansible.builtin.package:
    name:
      - syslinux
      - tftp-server
    state: present

- name: Enable and start the TFTP socket
  ansible.builtin.service:
    name: tftp.socket
    state: started
    enabled: true

- name: Create the ISO images directory
  ansible.builtin.file:
    path: "{{ pxe_isos_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download installation ISO images
  ansible.builtin.get_url:
    url: "{{ item.download_url }}"
    dest: "{{ item.iso_path }}"
    mode: "0640"
  loop: "{{ pxe_isos }}"

- name: Mount ISOs read-only under the web root
  ansible.posix.mount:
    path: "{{ item.mount_point }}"
    src: "{{ item.iso_path }}"
    fstype: iso9660
    opts: ro,loop
    state: mounted
  loop: "{{ pxe_isos }}"
  notify: Restart httpd

- name: Copy the Apache PXE configuration
  ansible.builtin.copy:
    src: httpd-pxe.conf
    dest: /etc/httpd/conf.d/httpd-pxe.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart httpd

- name: Copy the Apache autoindex configuration
  ansible.builtin.copy:
    src: autoindex.conf
    dest: /etc/httpd/conf.d/autoindex.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart httpd

- name: Copy the syslinux bootloader files
  ansible.builtin.copy:
    src: /usr/share/syslinux/
    dest: /var/lib/tftpboot/
    remote_src: true
    mode: preserve
    directory_mode: "0755"

- name: Create TFTP boot directories
  ansible.builtin.file:
    path: "/var/lib/tftpboot/{{ item.name }}"
    state: directory
    mode: "0755"
  loop: "{{ pxe_isos }}"

- name: Copy bootable kernel images
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.mount_point }}/images/pxeboot/vmlinuz"
    dest: "/var/lib/tftpboot/{{ item.name }}/vmlinuz"
    mode: "0644"
  loop: "{{ pxe_isos }}"

- name: Copy initrd images
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.mount_point }}/images/pxeboot/initrd.img"
    dest: "/var/lib/tftpboot/{{ item.name }}/initrd.img"
    mode: "0644"
  loop: "{{ pxe_isos }}"

- name: Create the pxelinux.cfg directory
  ansible.builtin.file:
    path: /var/lib/tftpboot/pxelinux.cfg
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the PXE boot menu
  ansible.builtin.template:
    src: default.j2
    dest: /var/lib/tftpboot/pxelinux.cfg/default
    owner: root
    group: root
    mode: "0644"

- name: Create the kickstart web directory
  ansible.builtin.file:
    path: /var/www/html/kickstart
    state: directory
    owner: apache
    group: apache
    mode: "0755"

- name: Deploy kickstart files
  ansible.builtin.template:
    src: "{{ item.name }}.cfg.j2"
    dest: "/var/www/html/kickstart/{{ item.name }}.cfg"
    owner: apache
    group: apache
    mode: "0644"
  loop: "{{ pxe_kickstarts }}"
