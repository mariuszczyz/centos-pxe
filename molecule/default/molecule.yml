  - name: fedora43
    image: registry.fedoraproject.org/fedora:43
    pre_build_image: false
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
    groups:
      - pxe
  - name: fedora44
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: false
    privileged: true
    command: /usr/sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
    groups:
      - pxe
provisioner:
