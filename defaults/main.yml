---
# defaults file for mariuszczyz.centos-pxe

# Refer to README.md for detailed explanation of each variable.

# PXE ROLE SECTION
# name: name of the operating system
# iso_location: location on the PXE boot server where OS installation ISO images are stored
# mount_point - this is where the installation ISO will be mounted,
#               needed by Apache to serve packages during the unattended installation process.

ISOS_PATH: /isos

ISOS:
  - NAME: centos-stream-9
    ISO_DOWNLOAD_URL: https://mirrors.edge.kernel.org/centos-stream/9/stream/x86_64/os/isos/9.4/CentOS-Stream-9-x86_64-dvd1.iso
    ISO_LOCATION: /isos/CentOS-Stream-9-x86_64-dvd1.iso
    MOUNT_POINT: /var/www/html/centos-stream-9

  - NAME: centos-stream-10
    ISO_DOWNLOAD_URL: https://mirrors.edge.kernel.org/centos-stream/10/stream/x86_64/os/isos/10.0/CentOS-Stream-10-x86_64-dvd1.iso
    ISO_LOCATION: /isos/CentOS-Stream-10-x86_64-dvd1.iso
    MOUNT_POINT: /var/www/html/centos-stream-10

  - NAME: fedora-40
    ISO_DOWNLOAD_URL: https://mirrors.edge.kernel.org/fedora/releases/40/Server/x86_64/iso/Fedora-Server-dvd-x86_64-40-1.14.iso
    ISO_LOCATION: /isos/Fedora-Server-dvd-x86_64-40-1.14.iso
    MOUNT_POINT: /var/www/html/fedora-40

  - NAME: fedora-41
    ISO_DOWNLOAD_URL: https://mirrors.edge.kernel.org/fedora/releases/41/Server/x86_64/iso/Fedora-Server-dvd-x86_64-41-1.4.iso
    ISO_LOCATION: /isos/Fedora-Server-dvd-x86_64-41-1.4.iso
    MOUNT_POINT: /var/www/html/fedora-41

KICKSTART_HASHED_ROOT_PASSWORD:
NON_ROOT_USER_NAME:
NON_ROOT_USER_PASSWORD:
TIMEZONE:
NTP_SERVERS:

FEDORA_HOSTNAME: fedora.home.local
FEDORA_NETWORK_INSTALLATION_URL: http://{{ ansible_default_ipv4.address }}/fedora-40

CENTOS_STREAM_9_HOSTNAME: centos-stream-9.home.local
CENTOS_STREAM_9_NETWORK_INSTALLATION_URL: http://{{ ansible_default_ipv4.address }}/centos-stream-9

CENTOS_STREAM_10_HOSTNAME: centos-stream-10.home.local
CENTOS_STREAM_10_NETWORK_INSTALLATION_URL: http://{{ ansible_default_ipv4.address }}/centos-stream-10
