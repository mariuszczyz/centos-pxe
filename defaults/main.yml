---
# defaults file for centos-pxe
#
# meta/argument_specs.yml validates input and documents every variable.
# The values below are the applied defaults; user vars override them.

pxe_isos_path: /isos

pxe_isos:
  - name: el9
    download_url: https://dl.rockylinux.org/pub/rocky/9/isos/x86_64/Rocky-9-latest-x86_64-dvd.iso
    iso_path: /isos/Rocky-9-latest-x86_64-dvd.iso
    mount_point: /var/www/html/el9
  - name: el10
    download_url: https://dl.rockylinux.org/pub/rocky/10/isos/x86_64/Rocky-10-latest-x86_64-dvd.iso
    iso_path: /isos/Rocky-10-latest-x86_64-dvd.iso
    mount_point: /var/www/html/el10
  - name: fedora
    download_url: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso/Fedora-Server-dvd-x86_64-44-1.7.iso
    iso_path: /isos/Fedora-Server-dvd-x86_64-44-1.7.iso
    mount_point: /var/www/html/fedora

pxe_kickstarts:
  - name: el9-base
    iso: el9
    label: Base unattended EL9 kickstart install (text mode)
  - name: el10-base
    iso: el10
    label: Base unattended EL10 kickstart install (text mode)
  - name: fedora-base
    iso: fedora
    label: Base unattended Fedora kickstart install (text mode)

pxe_ntp_servers: ""

pxe_el9_hostname: el9.home.local
pxe_el9_install_url: "http://{{ ansible_default_ipv4['address'] }}/el9"

pxe_el10_hostname: el10.home.local
pxe_el10_install_url: "http://{{ ansible_default_ipv4['address'] }}/el10"

pxe_fedora_hostname: fedora.home.local
pxe_fedora_install_url: "http://{{ ansible_default_ipv4['address'] }}/fedora"
